name: Build WorkInk Browser

on:
  push:
    branches: [ workink-browser ]
    paths:
      - "WorkInkBrowser/**"
      - ".github/workflows/workink-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish standalone EXE
        run: dotnet publish WorkInkBrowser/WorkInkBrowser.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: WorkInkBrowser-win-x64
          path: WorkInkBrowser/bin/Release/net10.0-windows/win-x64/publish/WorkInkBrowser.exe
          if-no-files-found: error
          retention-days: 14
